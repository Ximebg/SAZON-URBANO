services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: sazon_wireguard
    cap_add:
      - NET_ADMIN
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Bogota
      SERVERURL: auto
      SERVERPORT: 51820
      PEERS: 1
      PEERDNS: auto
      INTERNAL_SUBNET: 10.13.13.0
      LOG_CONFS: "true"
    volumes:
      - ./config:/config
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped